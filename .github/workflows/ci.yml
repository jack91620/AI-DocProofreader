name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  UV_NO_SYNC_PYTHON_DOWNLOADS: "0"

jobs:
  lint:
    name: Lint & Type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # licloud 是私有 wheel，CI 上没有 → 跳过 [licloud] extra
      - name: Sync deps (without licloud)
        run: uv sync --extra claude --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        # 渐进收紧，先不让CI红
        continue-on-error: true
        run: uv run mypy src

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src

  test:
    name: Test (Py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync deps (without licloud)
        run: uv sync --extra claude --group dev --python ${{ matrix.python }}

      - name: Run tests (offline, cassette-replay only)
        run: |
          uv run pytest -n auto \
            -m "not live" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: Upload coverage to Codecov
        if: matrix.python == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 14

  build:
    name: Build wheel
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true
      - run: uv python install 3.11
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
