# 计算机术语规范词典
#
# 规范来源: 全国科学技术名词审定委员会 / 全国计算机科学技术名词审定委员会
#           《计算机科学技术名词》(第三版 2018, 8795 条) — 见 https://www.cnterm.cn/
#
# 数据格式
# ========
# - section "regional_variants": 港台/外来用词 → 大陆规范词
#   每条形如 "preferred: [variant1, variant2, ...]"，扫描时若发现 variant，
#   建议改为 preferred。
# - section "competing_translations": 同义不同译，保留多种但建议全书统一。
#   形如 "english: [zh1, zh2, ...]"，第一个为推荐译名，但其余也合规。
#   一致性扫描会发现"全书同时出现 zh1 和 zh2"并提示。
# - section "english_should_be_kept": 不译为中文的固定术语（保持英文）

regional_variants:
  # 港台 → 大陆
  程序: [程式, 程式碼, 程式码]
  程序设计: [程式设计]
  软件: [软体, 軟體]
  硬件: [硬体, 硬體]
  数据: [資料]      # 注意"资料"在大陆也合法义("参考资料")，仅当对应 data 时建议
  数据库: [資料庫, 资料库]
  网络: [網路, 网路]
  服务器: [伺服器]
  终端: [終端機]
  内存: [記憶體, 记忆体]
  磁盘: [磁碟]
  文件: [檔案]      # 注意"档案"在大陆也合法义("人事档案")
  文件夹: [資料夾, 资料夹, 檔案夾, 档案夹]
  下载: [下載]
  上传: [上載, 上传]   # 注意保留正确的简体"上传"
  打印: [列印]
  打印机: [印表機, 印表机]
  字体: [字型]
  字符: [字元]
  位: [位元]        # bit
  字节: [位元組, 位元组]
  分辨率: [解析度]
  鼠标: [滑鼠]
  键盘: [鍵盤, 键盤]
  屏幕: [螢幕, 萤幕]
  视频: [影片]      # 注意"影片"在大陆也合法义
  音频: [音訊]
  视频卡: [顯示卡, 显卡]   # 简体也常用"显卡"，仅在严格"视频卡"上下文建议
  集成电路: [積體電路]
  操作系统: [作業系統, 操做系统]
  操作: [操做]
  缓存: [快取, 暫存]
  类: [類別]
  对象: [物件]
  接口: [介面]
  指针: [指標]
  默认: [預設, 缺省]   # "缺省"在大陆也历史合法
  配置: [組態, 组态]
  访问: [存取]      # "存取"也常用，建议大陆教材统一"访问"
  打开: [開啟, 开啟]
  保存: [儲存]
  退出: [離開, 关闭]   # 退出与关闭区分；这里仅匹配"離開"
  剪切: [剪下]
  粘贴: [貼上, 贴上]
  撤销: [復原, 复原]
  恢复: [還原]
  设置: [設定]
  选项: [選項]
  菜单: [選單, 选单]
  按钮: [按鈕]
  窗口: [視窗]
  对话框: [對話方塊]
  弹出: [跳出]      # "跳出"也常用
  错误: [錯誤]      # 简繁
  调试: [偵錯, 除錯]
  编译: [編譯]
  反汇编: [反組譯, 反组译]
  执行: [執行]
  线程: [執行緒, 执行绪]
  进程: [行程]      # 注意"行程"在大陆有不同义
  数组: [陣列]
  栈: [堆疊]        # 注意"堆栈"在大陆也常用，可保留
  队列: [佇列, 伫列]
  链表: [鏈結串列, 链结串列]
  哈希: [雜湊, 杂凑]
  函数: [函式]
  方法: [方式]      # 仅指 method，不是"方法论"的方法
  变量: [變量, 變數, 变数]
  常量: [常數]      # "常数"在数学中也合法
  参数: [參數, 引數]
  返回值: [傳回值]
  循环: [迴圈]
  递归: [遞迴]
  指令: [指令]      # 简繁
  语句: [陳述]
  表达式: [運算式, 运算式]
  运算符: [運算子, 运算子]

competing_translations:
  # 推荐译名（第一个）+ 可接受变体；全书应统一
  robustness: [鲁棒性, 健壮性, 稳健性]
  scalability: [可扩展性, 可伸缩性, 可拓展性]
  performance: [性能, 效能]
  bug: [缺陷, 漏洞, 错误]
  thread: [线程, 执行绪]
  cache: [缓存, 高速缓存, 快取]
  pipeline: [流水线, 管道, 管线]
  queue: [队列, 伫列]
  stack: [栈, 堆栈, 栈区]
  framework: [框架, 架构]
  package: [包, 程序包, 套件]
  module: [模块, 模组]
  template: [模板, 范本]
  cluster: [集群, 群集]
  algorithm: [算法, 演算法]
  protocol: [协议, 协定]
  schema: [模式, 架构, 纲要]
  binding: [绑定, 系结]
  callback: [回调, 回调函数, 调回]
  hash: [哈希, 散列]

english_should_be_kept:
  # 这些词在中文教材中常以英文出现，规范允许
  - HTTP
  - HTTPS
  - TCP
  - UDP
  - IP
  - URL
  - URI
  - JSON
  - XML
  - HTML
  - CSS
  - SQL
  - API
  - SDK
  - CPU
  - GPU
  - RAM
  - ROM
  - SSD
  - HDD
  - USB
  - DNS
  - CDN
  - VPN
  - SSH
  - SSL
  - TLS
  - PDF
